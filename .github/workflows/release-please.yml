name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # reads release-please-config.json and .release-please-manifest.json,
      # opens/updates the release PR and creates tag + GitHub release on merge
      - uses: googleapis/release-please-action@v4
